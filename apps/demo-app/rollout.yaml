apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: demo-nginx
  labels:
    app: demo-nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-nginx
  template:
    metadata:
      labels:
        app: demo-nginx
    spec:
      containers:
        - name: nginx
          image: gitopsacradharsh.azurecr.io/demo-app:57a3c959c3281f26a4e994a38594f1f1cf93769f
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "1m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
  strategy:
    canary:
      maxSurge: 0
      maxUnavailable: 1
      steps:
        - setWeight: 10
        - pause:
            duration: 30s
        - setWeight: 50
        - pause:
            duration: 30s
        - setWeight: 100
