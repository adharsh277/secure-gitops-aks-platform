apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-nginx
  labels:
    app: demo-nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-nginx
  template:
    metadata:
      labels:
        app: demo-nginx
    spec:
      containers:
      - name: nginx
        image: gitopsacradharsh.azurecr.io/demo-app:57a3c959c3281f26a4e994a38594f1f1cf93769f
        ports:
        - containerPort: 80