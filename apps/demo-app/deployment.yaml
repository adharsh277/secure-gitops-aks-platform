apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-nginx
  labels:
    app: demo-nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-nginx
  template:
    metadata:
      labels:
        app: demo-nginx
    spec:
      containers:
      - name: nginx
        image: gitopsacradharsh.azurecr.io/demo-app:b8844a18b3bf8697c6a8964ff942b908739c1e6e
        ports:
        - containerPort: 80