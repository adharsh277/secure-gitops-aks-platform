apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-nginx
  labels:
    app: demo-nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-nginx
  template:
    metadata:
      labels:
        app: demo-nginx
    spec:
      containers:
      - name: nginx
        image: gitopsacradharsh.azurecr.io/demo-app:2f9e06eea5f08ffa29a321bcd4bf8bb335d60a08
        ports:
        - containerPort: 80